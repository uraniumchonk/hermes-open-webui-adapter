# ═══════════════════════════════════════════════════════════
# Hermes Tool Filter — Configuration
# ═══════════════════════════════════════════════════════════
# 需要改的在上；預設 / 很少動的在下。
# Env 可覆寫：TOOL_MODE, BIND_PORT, BIND_HOST, AUTO_SPLIT_THRESHOLD
# 穩定參考：git 877fdb7（structured 上線後、flat 刪除前的完整 config）

# ── 必改 ──────────────────────────────────────────────────
# path prefix → 本機 Hermes Gateway
# Open WebUI Base URL：http://<host>:9099/<port>/v1
upstreams:
  "30001": "http://127.0.0.1:30001"   # coder
  "30002": "http://127.0.0.1:30002"   # coder-master
  "30003": "http://127.0.0.1:30003"   # analyst
  "30004": "http://127.0.0.1:30004"   # trader
  "30005": "http://127.0.0.1:30005"   # family

# ── 常用：工具歷史怎麼餵回模型（兩個範本二選一）──────────
# 把 Open WebUI 存下的 <details type="tool_calls"> 轉成模型可讀歷史。
#
# structured（目前 runtime 唯一路徑，推薦）
#   → 拆成 OpenAI native assistant.tool_calls + role=tool
#   → 需 api_server_chat_completions_all.patch（否則 Gateway 會丟 tool role）
#
# flat（舊 workaround，已從 runtime 移除；見 git ≤877fdb7）
#   → 仍塞回同一條 assistant content，包成 [START_PREV_ACTION]...[END_PREV_ACTION]
#   → 不需 tool-role patch，但要 tool_hint 防模型模仿；長對話仍可能污染
#
# 詳見 README「兩個歷史範本」。
tool_history_format: "structured"

enable_history_sanitization: true
sanitization_result_max_length: 20000

# enhance-v2 = 即時串流 + <details> tool card（Open WebUI）
tool_mode: "enhance-v2"

# ── 預設 / 很少改 ─────────────────────────────────────────
bind_host: "0.0.0.0"
bind_port: 9099
auto_split_threshold: 0          # 0=關；Conduit 不支援 session.split
compression_mode: "disabled"     # server-side | disabled
session_isolation_mode: "disabled"  # marker | disabled
comp_mode: "disabled"            # 訊息含 [comp] 時壓縮舊 tool 文字

# flat 時代用的 hint 檔（structured 不需要；保留鍵名僅供對照舊文件）
# tool_usage_hint_file: "tool_hint.txt"
